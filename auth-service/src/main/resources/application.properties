spring.application.name=auth-service
server.port=8101
security.jwt.secret=ProjetoSIDISG63DA20261241008120110712308501231121

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL_1},${EUREKA_URL_2}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# SQLite Database Configuration
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:/data/auth.db
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



security.jwt.expiration-ms=3600000

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui
springdoc.swagger-ui.disable-swagger-default-url=true