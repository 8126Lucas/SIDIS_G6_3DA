services:
  # ------------------------------------------------------
  # DISCOVERY e API-GATEWAY
  # ------------------------------------------------------
  discovery-node1:
    build: ./discovery-service
    image: ghcr.io/${REPO_OWNER}/discovery-service:latest
    container_name: discovery-node1
    profiles: ["pc1"]
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=node1
      - EUREKA_INSTANCE_HOSTNAME=discovery-node1
    deploy:
      resources:
        limits:
          memory: 300M

  discovery-node2:
    build: ./discovery-service
    image: ghcr.io/${REPO_OWNER}/discovery-service:latest
    container_name: discovery-node2
    profiles: ["pc3"]
    ports:
      - "8762:8762"
    environment:
      - SPRING_PROFILES_ACTIVE=node2
      - EUREKA_INSTANCE_HOSTNAME=discovery-node2
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    deploy:
      resources:
        limits:
          memory: 300M

  api-gateway:
    build: ./APIgateway
    image: ghcr.io/${REPO_OWNER}/api-gateway:latest
    container_name: api-gateway
    profiles: ["pc1"]
    ports:
      - "7979:7979"
    environment:
      - SERVER_PORT=7979
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL_1},${EUREKA_URL_2}
      - EUREKA_INSTANCE_IP_ADDRESS=${IP_PC1}
    deploy:
      resources:
        limits:
          memory: 300M

  # ------------------------------------------------------
  # AUTH, AIRCRAFT, AIRPORT, FLIGHT, MAINTENANCE e ROUTE
