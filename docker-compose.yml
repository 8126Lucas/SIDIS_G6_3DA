    container_name: aircraft-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-node1:8761/eureka/,http://discovery-node2:8762/eureka/
    depends_on:
      - discovery-node1
    deploy:
      resources:
        limits:
          memory: 300M

  airport-service:
    build: ./airport-service
    image: ghcr.io/${REPO_OWNER}/airport-service:latest
    container_name: airport-service
    ports:
      - "8091:8091"
    environment:
      - SERVER_PORT=8091
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-node1:8761/eureka/,http://discovery-node2:8762/eureka/
