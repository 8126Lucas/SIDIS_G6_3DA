services:
  # ------------------------------------------------------
  # DISCOVERY e API-GATEWAY
  # ------------------------------------------------------
  discovery-node1:
    build: ./discovery-service
    image: ghcr.io/${REPO_OWNER}/discovery-service:latest
    container_name: discovery-node1
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=node1
      - EUREKA_INSTANCE_HOSTNAME=discovery-node1
    deploy:
      resources:
        limits:
          memory: 300M

  discovery-node2:
    build: ./discovery-service
    image: ghcr.io/${REPO_OWNER}/discovery-service:latest
    container_name: discovery-node2
    ports:
      - "8762:8762"
    environment:
      - SPRING_PROFILES_ACTIVE=node2
      - EUREKA_INSTANCE_HOSTNAME=discovery-node2
    deploy:
      resources:
        limits:
          memory: 300M

  api-gateway:
    build: ./APIgateway
    image: ghcr.io/${REPO_OWNER}/api-gateway:latest
    container_name: api-gateway
    ports:
      - "7979:7979"
    environment:
      - SERVER_PORT=7979
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-node1:8761/eureka/,http://discovery-node2:8762/eureka/
    depends_on:
      - discovery-node1
      - discovery-node2
    deploy:
      resources:
        limits:
          memory: 300M

  # ------------------------------------------------------
  # AUTH, AIRCRAFT, AIRPORT, FLIGHT, MAINTENANCE e ROUTE
  # ------------------------------------------------------
  auth-service:
    build: ./auth-service
    image: ghcr.io/${REPO_OWNER}/auth-service:latest
    container_name: auth-service
    ports:
      - "8101:8101"
    environment:
      - SERVER_PORT=8101
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-node1:8761/eureka/,http://discovery-node2:8762/eureka/
    depends_on:
      - discovery-node1
    deploy:
      resources:
        limits:
          memory: 300M

  aircraft-service:
