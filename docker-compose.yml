      - "8111:8111"
    environment:
      - SERVER_PORT=8111
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-node1:8761/eureka/,http://discovery-node2:8762/eureka/
    depends_on:
      - discovery-node1
    deploy:
