      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - EUREKA_INSTANCE_IP_ADDRESS=${IP_PC2}
      - EUREKA_INSTANCE_INSTANCE_ID=${IP_PC2}:auth-service:8101
    deploy:
