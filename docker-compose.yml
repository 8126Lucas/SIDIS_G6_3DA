services:
  # ------------------------------------------------------
  # DISCOVERY e API-GATEWAY
  # ------------------------------------------------------
  discovery-node1:
    build: ./discovery-service
    image: ghcr.io/${REPO_OWNER}/discovery-service:latest
    container_name: discovery-node1
    profiles: ["pc1"]
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=node1
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - EUREKA_INSTANCE_IP_ADDRESS=${IP_PC1}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL_2}
      - EUREKA_URL_1=${EUREKA_URL_1}
      - EUREKA_URL_2=${EUREKA_URL_2}
    deploy:
      resources:
        limits:
          memory: 300M
  discovery-node2:
    build: ./discovery-service
    image: ghcr.io/${REPO_OWNER}/discovery-service:latest
    container_name: discovery-node2
    profiles: ["pc2"]
    ports:
      - "8762:8762"
    environment:
      - SPRING_PROFILES_ACTIVE=node2
      - EUREKA_INSTANCE_HOSTNAME=discovery-node2
      - EUREKA_INSTANCE_IP_ADDRESS=${IP_PC3}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL_1}
      - EUREKA_INSTANCE_INSTANCE_ID=${IP_PC3}:discovery-node2:8762
      - EUREKA_URL_1=${EUREKA_URL_1}
    deploy:
      resources:
        limits:
          memory: 300M

  api-gateway-1:
    build: ./APIgateway
    image: ghcr.io/${REPO_OWNER}/api-gateway:latest
    container_name: api-gateway-1
    profiles: ["pc1"]
    ports:
      - "7979:7979"
    environment:
      - SERVER_PORT=7979
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL_1},${EUREKA_URL_2}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - EUREKA_INSTANCE_HOSTNAME=api-gateway-1
      - EUREKA_INSTANCE_IP_ADDRESS=${IP_PC1}
      - EUREKA_INSTANCE_INSTANCE_ID=${IP_PC1}:api-gateway:7979
    deploy:
      resources:
        limits:
          memory: 300M
  api-gateway-2:
    build: ./APIgateway
    image: ghcr.io/${REPO_OWNER}/api-gateway:latest
    container_name: api-gateway-2
    profiles: ["pc4"]
    ports:
      - "7980:7980"
    environment:
      - SERVER_PORT=7980
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL_1},${EUREKA_URL_2}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - EUREKA_INSTANCE_HOSTNAME=api-gateway-2
      - EUREKA_INSTANCE_IP_ADDRESS=${IP_PC4}
      - EUREKA_INSTANCE_INSTANCE_ID=${IP_PC4}:api-gateway:7980
    deploy:
      resources:
        limits:
          memory: 300M

  # ------------------------------------------------------
  # REDIS DATABASE
  # ------------------------------------------------------
  redis-aircraft-1:
    image: redis:7-alpine
    container_name: redis-aircraft-1
    profiles: ["pc1"]
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 300M
  redis-aircraft-2:
    image: redis:7-alpine
    container_name: redis-aircraft-2
    profiles: ["pc2"]
    ports:
      - "6380:6379"
    deploy:
      resources:
        limits:
          memory: 300M
  redis-aircraft-3:
    image: redis:7-alpine
    container_name: redis-aircraft-3
    profiles: ["pc3"]
    ports:
      - "6381:6379"
    deploy:
      resources:
        limits:
          memory: 300M

  redis-maintenance-1:
    image: redis:7-alpine
    container_name: redis-maintenance-1
    profiles: ["pc1"]
    ports:
      - "6382:6379"
    deploy:
      resources: { limits: { memory: 100M } }
  redis-maintenance-2:
    image: redis:7-alpine
    container_name: redis-maintenance-2
    profiles: ["pc2"]
    ports:
      - "6383:6379"
    deploy:
      resources: { limits: { memory: 100M } }
  redis-maintenance-3:
    image: redis:7-alpine
    container_name: redis-maintenance-3
    profiles: ["pc3"]
    ports:
      - "6384:6379"
    deploy:
      resources: { limits: { memory: 100M } }

  redis-airport-1:
    image: redis:7-alpine
    container_name: redis-airport-1
    profiles: [ "pc4" ]
    ports:
      - "6385:6379"
    deploy:
      resources: { limits: { memory: 100M } }
  redis-airport-2:
    image: redis:7-alpine
    container_name: redis-airport-2
    profiles: [ "pc5" ]
    ports:
      - "6386:6379"
    deploy:
      resources: { limits: { memory: 100M } }
  redis-airport-3:
    image: redis:7-alpine
    container_name: redis-airport-3
    profiles: [ "pc5" ]
    ports:
      - "6387:6379"
    deploy:
      resources: { limits: { memory: 100M } }

  redis-flight-1:
    image: redis:7-alpine
    container_name: redis-flight-1
    profiles: [ "pc4" ]
    ports:
      - "6388:6379"
    deploy:
      resources: { limits: { memory: 100M } }
  redis-flight-2:
    image: redis:7-alpine
    container_name: redis-flight-2
    profiles: [ "pc5" ]
    ports:
      - "6389:6379"
    deploy:
      resources: { limits: { memory: 100M } }
  redis-flight-3:
    image: redis:7-alpine
    container_name: redis-flight-3
    profiles: [ "pc5" ]
    ports:
      - "6390:6379"
    deploy:
      resources: { limits: { memory: 100M } }

  redis-route-1:
    image: redis:7-alpine
    container_name: redis-route-1
    profiles: [ "pc4" ]
    ports:
      - "6391:6379"
    deploy:
      resources: { limits: { memory: 100M } }
  redis-route-2:
    image: redis:7-alpine
    container_name: redis-route-2
    profiles: [ "pc5" ]
    ports:
      - "6392:6379"
    deploy:
      resources: { limits: { memory: 100M } }
  redis-route-3:
    image: redis:7-alpine
    container_name: redis-route-3
    profiles: [ "pc5" ]
    ports:
      - "6393:6379"
    deploy:
      resources: { limits: { memory: 100M } }

  # ------------------------------------------------------
  # RABBITMQ CLUSTER
  # ------------------------------------------------------
  rabbitmq-1:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-1
    profiles: ["pc5"]
    ports:
      - "5672:5672"   # AMQP Port
      - "15672:15672" # Web Interface
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: sidis_cluster_secret
      RABBITMQ_NODENAME: rabbit1@rabbitmq-1
    deploy:
      resources: { limits: { memory: 300M } }
  rabbitmq-2:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-2
    profiles: ["pc5"]
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: sidis_cluster_secret
      RABBITMQ_NODENAME: rabbit2@rabbitmq-2
    deploy:
      resources: { limits: { memory: 300M } }
  rabbitmq-3:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-3
    profiles: ["pc3"]
    ports:
      - "5674:5672"
      - "15674:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: sidis_cluster_secret
      RABBITMQ_NODENAME: rabbit3@rabbitmq-3
    deploy:
      resources: { limits: { memory: 300M } }

  # ------------------------------------------------------
  # POSTGRESQL
  # ------------------------------------------------------
  postgresql-1:
    image: postgres:15-alpine
    container_name: postgresql-1
    profiles: [ "pc5" ]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sidis
      POSTGRES_PASSWORD: sidis
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data/postgres:/var/lib/postgresql/data
    deploy:
      resources: { limits: { memory: 500M } }

  # ------------------------------------------------------
  # PROMETHEUS
  # ------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    profiles: ["pc1"]
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--enable-feature=expand-env'
    environment:
      - IP_PC1=${IP_PC1}
      - IP_PC2=${IP_PC2}
      - IP_PC3=${IP_PC3}
      - IP_PC4=${IP_PC4}
      - IP_PC5=${IP_PC5}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    deploy:
      resources: { limits: { memory: 300M } }

  # ------------------------------------------------------
  # HAPROXY
  # ------------------------------------------------------
  haproxy:
    image: haproxy:2.8-alpine
    container_name: haproxy
    profiles: ["pc1"]
    ports:
      - "443:443"
      - "8404:8404"
    environment:
      - IP_PC1=${IP_PC1}
      - IP_PC4=${IP_PC4}
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    deploy:
      resources: { limits: { memory: 50M } }

