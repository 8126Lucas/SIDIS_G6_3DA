name: SIDIS Monorepo CD

on:
  workflow_run:
    workflows: ["SIDIS Monorepo CI"]
    types:
      - completed

jobs:
  build-services:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      repo_owner: ${{ steps.set-owner.outputs.repo_owner }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o JDK Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build com Maven (Todos os Microsserviços)
        run: mvn clean package -DskipTests

      - name: Colocar o username em minúsculas
        id: set-owner
        run: echo "repo_owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Upload dos artefactos de build
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: "**/target/*.jar"
          retention-days: 1

  push-images:
    needs: build-services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modulo: [aircraft-service, airport-service, APIgateway, auth-service, discovery-service, flight-service, maintenance-service, route-service]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Download dos artefactos de build
        uses: actions/download-artifact@v4
        with:
          name: maven-artifacts

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem para ${{ matrix.modulo }}
        run: |
          docker build \
            -t ghcr.io/${{ needs.build-services.outputs.repo_owner }}/${{ matrix.modulo }}:latest \
            -f ${{ matrix.modulo }}/Dockerfile \
            ${{ matrix.modulo }}
          
          docker push ghcr.io/${{ needs.build-services.outputs.repo_owner }}/${{ matrix.modulo }}:latest