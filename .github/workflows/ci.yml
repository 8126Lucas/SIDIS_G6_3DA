name: SIDIS Monorepo CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. VERIFICAÇÃO DE COMPILAÇÃO (Fail-Fast)
  compile:
    name: Compilação Preliminar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permissões de execução ao Maven Wrapper
        run: chmod +x mvnw

      - name: Verificar Compilação (Sem Testes)
        run: ./mvnw clean package -DskipTests

  # 2. TESTES JAVA
  java-tests:
    name: Build e Testes Java E2E
    needs: compile
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permissões de execução
        run: chmod +x mvnw

      - name: Iniciar Eureka e Gateway
        run: |
          ./mvnw clean package -DskipTests
          nohup java -Xmx256m -Dspring.profiles.active=node1 -jar discovery-service/target/*.jar > eureka.log 2>&1 &
          sleep 15
          nohup java -Xmx256m -jar APIgateway/target/*.jar > gateway.log 2>&1 &

      - name: Executar Microsserviços
        run: |
          nohup java -Xmx256m -jar auth-service/target/*.jar > auth.log 2>&1 &
          nohup java -Xmx256m -jar aircraft-service/target/*.jar > aircraft.log 2>&1 &
          nohup java -Xmx256m -jar maintenance-service/target/*.jar > maintenance.log 2>&1 &
          nohup java -Xmx256m -jar flight-service/target/*.jar > flight.log 2>&1 &
          nohup java -Xmx256m -jar route-service/target/*.jar > route.log 2>&1 &
          nohup java -Xmx256m -jar airport-service/target/*.jar > airport.log 2>&1 &

      - name: Esperar pelo registo no Eureka
        run: |
          echo "A aguardar 150 segundos para o Eureka registar todos os nós..."
          sleep 150

      - name: Validar Todos os Módulos (Testes Java E2E)
        run: ./mvnw verify

  # 3. TESTES POSTMAN
  postman-tests:
    name: Testes de Integração Postman
    needs: compile
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permissões de execução
        run: chmod +x mvnw

      - name: Iniciar Eureka e Gateway
        run: |
          ./mvnw clean package -DskipTests
          nohup java -Xmx256m -Dspring.profiles.active=node1 -jar discovery-service/target/*.jar > eureka.log 2>&1 &
          sleep 15
          nohup java -Xmx256m -jar APIgateway/target/*.jar > gateway.log 2>&1 &

      - name: Executar Microsserviços
        run: |
          nohup java -Xmx256m -jar auth-service/target/*.jar > auth.log 2>&1 &
          nohup java -Xmx256m -jar aircraft-service/target/*.jar > aircraft.log 2>&1 &
          nohup java -Xmx256m -jar maintenance-service/target/*.jar > maintenance.log 2>&1 &
          nohup java -Xmx256m -jar flight-service/target/*.jar > flight.log 2>&1 &
          nohup java -Xmx256m -jar route-service/target/*.jar > route.log 2>&1 &
          nohup java -Xmx256m -jar airport-service/target/*.jar > airport.log 2>&1 &

      - name: Esperar pelo registo no Eureka
        run: |
          echo "A aguardar 150 segundos para o Eureka registar todos os nós..."
          sleep 150

      - name: Instalar Newman
        run: npm install -g newman

      - name: Executar Testes API
        run: newman run "./docs/postman/SIDIS HTTP Tests.postman_collection.json"