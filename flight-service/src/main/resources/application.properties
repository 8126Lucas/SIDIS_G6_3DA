spring.application.name=flight-service
server.port=8111

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${IP_PC5:localhost}:5432/flight_db
spring.datasource.username=${DB_USERNAME:sidis}
spring.datasource.password=${DB_PASSWORD:sidis}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Redis Cluster
spring.data.redis.cluster.nodes=${SPRING_REDIS_CLUSTER_NODES:localhost:6388,localhost:6389,localhost:6390}
spring.data.redis.cluster.max-redirects=3

# RabbitMQ
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3000ms

# Actuator and Prometheus
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL_1},${EUREKA_URL_2}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
