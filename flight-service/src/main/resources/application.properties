spring.application.name=flight-service
server.port=8111
security.jwt.secret=ProjetoSIDISG63DA20261241008120110712308501231121

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL_1},${EUREKA_URL_2}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${IP_PC5:localhost}:5432/flight_db
spring.datasource.username=${DB_USERNAME:sidis}
spring.datasource.password=${DB_PASSWORD:sidis}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Redis Cluster


# RabbitMQ
spring.rabbitmq.addresses=${IP_PC5:localhost}:5672,${IP_PC5:localhost}:5673,${IP_PC3:localhost}:5674
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3000ms

# Actuator and Prometheus
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui
springdoc.swagger-ui.disable-swagger-default-url=true