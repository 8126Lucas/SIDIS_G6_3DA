spring.application.name=maintenance-service
server.port=8085
security.jwt.secret=ProjetoSIDISG63DA20261241008120110712308501231121Maintenance

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Show SQL Statements in the Console (Optional)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

security.jwt.expiration-ms=3600000

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui
springdoc.swagger-ui.disable-swagger-default-url=true

# Services Base URLs
services.aircraft.base-url=http://localhost:8081