spring.application.name=maintenance-service
server.port=8121
security.jwt.secret=ProjetoSIDISG63DA20261241008120110712308501231121

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL_1},${EUREKA_URL_2}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${IP_PC5:localhost}:5432/maintenance_db
spring.datasource.username=sidis
spring.datasource.password=sidis

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis Database Configuration
spring.data.redis.cluster.nodes=${SPRING_REDIS_CLUSTER_NODES:localhost:6379,localhost:6380,localhost:6381}
spring.data.redis.cluster.max-redirects=3

# RabbitMQ
spring.rabbitmq.addresses=${IP_PC5:localhost}:5672,${IP_PC5:localhost}:5673,${IP_PC3:localhost}:5674
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=3000ms

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui
springdoc.swagger-ui.disable-swagger-default-url=true

# Spring Actuator
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}