spring.application.name=airport-service
server.port=8091

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL_1},${EUREKA_URL_2}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${IP_PC5:localhost}:5432/airport_db
spring.datasource.username=${DB_USERNAME:sidis}
spring.datasource.password=${DB_PASSWORD:sidis}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Swagger
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui
springdoc.swagger-ui.disable-swagger-default-url=true
