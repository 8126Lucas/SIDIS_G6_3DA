global
    maxconn 1000

defaults
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

# ==========================================
# Visual Dashboard
# ==========================================
frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 2s

# ==========================================
# Entry Port
# ==========================================
frontend api_gateway_front
    bind *:443
    mode tcp
    default_backend api_gateway_back

# ==========================================
# Load Balancer
# ==========================================
backend api_gateway_back
    mode tcp
    balance roundrobin
    server gateway1 "${IP_PC1}:7979" check
    server gateway2 "${IP_PC4}:7980" check