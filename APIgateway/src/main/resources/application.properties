# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/

# Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Aircraft Service (Hangar e Catalog)
spring.cloud.gateway.server.webflux.routes[1].id=aircraft-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://aircraft-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/hangar/**, /api/catalog/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=JwtAuthentication

